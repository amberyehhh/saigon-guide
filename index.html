<meta charset="utf-8" />
<title>西貢踩點手冊（真地圖版）</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#3A2E22;
    --paper:#FFFBF2;
    --paper-raised:#FFFFFF;
    --paper-sunk:#FFF3DE;
    --jade:#3672B0;
    --jade-ink:#3A2E22;
    --brass:#E8752A;
    --orange:#E8752A; --orange-soft:#FBD9BC; --blue:#3672B0; --blue-soft:#CFE0F2;
    --line:rgba(58,46,34,0.16);
    --line-soft:rgba(58,46,34,0.12);
    --done-ink:rgba(58,46,34,0.5);
    --shadow:rgba(58,46,34,0.16);
    --star-off:rgba(58,46,34,0.22);
    --star-on:#E8752A;
    --notebook-line:rgba(58,46,34,0.07); --margin-line:rgba(232,117,42,0.28);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink:#F3E9DC; --paper:#211A13; --paper-raised:#2B231A; --paper-sunk:#1A140E;
      --jade:#7FB0E0; --jade-ink:#F3E9DC; --brass:#F0965A;
      --orange:#F0965A; --orange-soft:#4A3420; --blue:#7FB0E0; --blue-soft:#233D57;
      --line:rgba(243,233,220,0.18); --line-soft:rgba(243,233,220,0.12);
      --done-ink:rgba(243,233,220,0.55); --shadow:rgba(0,0,0,0.4);
      --star-off:rgba(243,233,220,0.22); --star-on:#F0965A;
      --notebook-line:rgba(243,233,220,0.06); --margin-line:rgba(240,150,90,0.22);
    }
  }
  :root[data-theme="dark"]{
    --ink:#F3E9DC; --paper:#211A13; --paper-raised:#2B231A; --paper-sunk:#1A140E;
    --jade:#7FB0E0; --jade-ink:#F3E9DC; --brass:#F0965A;
    --orange:#F0965A; --orange-soft:#4A3420; --blue:#7FB0E0; --blue-soft:#233D57;
    --line:rgba(243,233,220,0.18); --line-soft:rgba(243,233,220,0.12);
    --done-ink:rgba(243,233,220,0.55); --shadow:rgba(0,0,0,0.4);
    --star-off:rgba(243,233,220,0.22); --star-on:#F0965A;
    --notebook-line:rgba(243,233,220,0.06); --margin-line:rgba(240,150,90,0.22);
  }
  :root[data-theme="light"]{
    --ink:#3A2E22; --paper:#FFFBF2; --paper-raised:#FFFFFF; --paper-sunk:#FFF3DE;
    --jade:#3672B0; --jade-ink:#3A2E22; --brass:#E8752A;
    --orange:#E8752A; --orange-soft:#FBD9BC; --blue:#3672B0; --blue-soft:#CFE0F2;
    --line:rgba(58,46,34,0.16); --line-soft:rgba(58,46,34,0.12);
    --done-ink:rgba(58,46,34,0.5); --shadow:rgba(58,46,34,0.16);
    --star-off:rgba(58,46,34,0.22); --star-on:#E8752A;
    --notebook-line:rgba(58,46,34,0.07); --margin-line:rgba(232,117,42,0.28);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      repeating-linear-gradient(var(--paper) 0px, var(--paper) 27px, var(--notebook-line) 28px),
      linear-gradient(90deg, transparent 34px, var(--margin-line) 35px, var(--margin-line) 36px, transparent 37px);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100%;
  }
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;}
  a{color:inherit;}
  button{font:inherit;}
  :focus-visible{outline:2px solid var(--orange);outline-offset:2px;}
  .icon{width:15px;height:15px;flex:0 0 auto;display:inline-block;vertical-align:-2px;}

  .wrap{max-width:640px;margin:0 auto;padding:0 16px 72px;}

  header.top{position:sticky;top:0;z-index:20;background:var(--paper);padding:16px 16px 0;border-bottom:2px dashed var(--line);}
  header.top .inner{max-width:640px;margin:0 auto;}
  .title-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;text-wrap:balance;}
  h1{font-family:"Klee One",-apple-system,sans-serif;font-weight:600;font-size:1.45rem;margin:0;transform:rotate(-0.6deg);display:inline-block;}
  .lang-vi h1{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;font-weight:800;}
  .progress{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;font-size:0.78rem;color:var(--blue);white-space:nowrap;font-weight:700;}
  .langbtn{flex:0 0 auto;padding:6px 12px;min-height:32px;border-radius:100px;border:1.5px solid var(--blue);background:var(--blue-soft);color:var(--blue);font-size:0.72rem;font-weight:700;letter-spacing:0.04em;cursor:pointer;transform:rotate(2deg);}
  .langbtn:active{background:var(--blue);color:#fff;}
  .subtitle{margin:4px 0 10px;font-size:0.78rem;color:var(--done-ink);}

  .sharebar{display:flex;gap:8px;margin-bottom:10px;}
  .sharebtn{
    flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    padding:8px 10px;border-radius:100px;border:1px solid var(--line);
    background:var(--paper-raised);color:var(--ink);font-size:0.78rem;cursor:pointer;
  }
  .sharebtn:active{background:var(--paper-sunk);}

  .tabs{display:flex;gap:4px;margin-top:2px;}
  .tab{
    flex:1;text-align:center;padding:9px 4px;font-size:0.85rem;
    border:none;background:transparent;color:var(--done-ink);cursor:pointer;
    border-bottom:2px solid transparent;
  }
  .tab.active{color:var(--orange);border-bottom-color:var(--orange);font-weight:700;}

  .search-row{padding:10px 0 10px;}
  .search{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper-raised);color:var(--ink);font-size:0.95rem;outline:none;}
  .search:focus{border-color:var(--orange);}
  .search::placeholder{color:var(--done-ink);}

  .chiprow{display:flex;gap:8px;overflow-x:auto;padding:0 2px 10px;scrollbar-width:none;}
  .chiprow::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto;padding:6px 12px;border-radius:100px;border:1px solid var(--line);background:var(--paper-raised);color:var(--ink);font-size:0.76rem;white-space:nowrap;cursor:pointer;transition:background .15s,color .15s,border-color .15s;}
  .chip.active{background:var(--orange);border-color:var(--orange);color:#fff;}

  .view{display:none;}
  .view.active{display:block;}

  section.area{margin-top:30px;scroll-margin-top:210px;}
  .area-head{display:flex;align-items:baseline;gap:10px;border-bottom:2px dashed var(--line);padding-bottom:6px;margin-bottom:4px;}
  .area-head h2{font-family:"Noto Serif TC",Georgia,serif;font-size:1.1rem;margin:0;text-wrap:balance;color:var(--orange);}
  .area-count{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:0.7rem;color:var(--done-ink);margin-left:auto;}
  .area-desc{font-size:0.76rem;color:var(--done-ink);margin:6px 0 12px;}

  .card{position:relative;background:var(--paper-raised);border:1px solid var(--line-soft);border-radius:12px;padding:12px 14px;margin-bottom:16px;box-shadow:0 4px 12px var(--shadow);transition:opacity .2s;}
  .card:nth-child(odd){transform:rotate(-0.4deg);}
  .card:nth-child(even){transform:rotate(0.4deg);}
  .card::before{
    content:"";position:absolute;top:-8px;left:18px;width:38px;height:16px;
    background:var(--orange-soft);opacity:0.85;border-radius:2px;transform:rotate(-3deg);
  }
  .card.done{opacity:0.6;}
  .card.hide{display:none;}
  .card-top{display:flex;gap:12px;align-items:flex-start;}

  .check{flex:0 0 auto;width:44px;height:44px;margin:-11px 0 0 -11px;border-radius:50%;background:transparent;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
  .check-ring{width:22px;height:22px;border-radius:50%;border:2px solid var(--orange);display:flex;align-items:center;justify-content:center;color:#fff;font-size:0.85rem;line-height:1;}
  .card.done .check-ring{background:var(--orange);}

  .card-body{flex:1;min-width:0;}
  .card-name-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .card-name{font-family:"Noto Serif TC",Georgia,serif;font-size:1rem;font-weight:700;text-wrap:balance;}
  .card.done .card-name{text-decoration:line-through;color:var(--done-ink);}
  .tag{font-size:0.66rem;padding:2px 8px;border-radius:100px;border:1px solid var(--line);color:var(--done-ink);white-space:nowrap;}
  .day-pill{font-size:0.66rem;padding:2px 8px;border-radius:100px;background:var(--blue);color:#fff;white-space:nowrap;font-weight:700;}
  .card-note{font-size:0.82rem;margin-top:4px;color:var(--ink);opacity:0.85;text-wrap:balance;}

  .card-actions{margin-top:9px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .maplink{display:inline-flex;align-items:center;gap:5px;font-size:0.74rem;padding:5px 11px;border:1.5px solid var(--orange);color:var(--orange);border-radius:100px;text-decoration:none;transition:background .15s,color .15s;font-weight:700;}
  .maplink:hover{background:var(--orange);color:#fff;}
  .ghostbtn{display:inline-flex;align-items:center;gap:4px;font-size:0.74rem;padding:5px 10px;border:1px solid var(--line);color:var(--ink);background:transparent;border-radius:100px;cursor:pointer;}
  .ghostbtn:active{background:var(--paper-sunk);}
  .daypick{font-size:0.74rem;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--paper-raised);color:var(--ink);}

  .detail{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}
  .detail.open{display:block;}
  .stars{display:flex;margin:-9px -9px 8px 0;}
  .star{background:none;border:none;font-size:1.1rem;line-height:1;cursor:pointer;padding:11px 9px;color:var(--star-off);}
  .star.on{color:var(--star-on);}
  .notearea{width:100%;min-height:56px;resize:vertical;padding:8px 10px;border-radius:8px;border:1px dashed var(--line);background:var(--paper-sunk);color:var(--ink);font-size:0.84rem;font-family:inherit;outline:none;}
  .notearea:focus{border-color:var(--orange);}

  .empty-msg{display:none;text-align:center;padding:40px 0;color:var(--done-ink);font-size:0.9rem;}
  .empty-msg.show{display:block;}

  /* ---- real map view ---- */
  #leafletMap{
    width:100%;height:calc(100dvh - 210px);min-height:460px;
    border:1px solid var(--line);border-radius:12px;margin-top:14px;
    background:var(--paper-sunk);
    position:relative;
  }
  .leaflet-container{font-family:inherit;}
  .leaflet-control-zoom a{width:40px !important;height:40px !important;line-height:40px !important;font-size:1.1rem !important;}
  .cute-pin{
    width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
    border:2.5px solid #fff;box-shadow:0 2px 5px rgba(58,46,34,0.25);
    display:flex;align-items:center;justify-content:center;
  }
  .cute-pin::after{content:"";width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,0.9);}
  .cute-pin.done{opacity:0.5;}
  .leaflet-popup-content-wrapper{background:var(--paper-raised);color:var(--ink);border-radius:10px;}
  .leaflet-popup-tip{background:var(--paper-raised);}
  .leaflet-popup-content{font-size:0.82rem;margin:10px 22px 10px 12px;line-height:1.5;}
  .popup-name{font-family:"Noto Serif TC",Georgia,serif;font-weight:700;font-size:0.92rem;display:block;margin-bottom:3px;}
  .popup-note{color:var(--done-ink);font-size:0.78rem;margin-top:3px;}
  .popup-link{color:var(--orange);font-size:0.76rem;text-decoration:underline;display:inline-block;margin-top:5px;}
  .map-offline-note{
    font-size:0.74rem;color:var(--done-ink);text-align:center;margin-top:8px;
  }

  .map-legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:14px;}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:0.74rem;color:var(--done-ink);}
  .legend-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
  .map-note{font-size:0.74rem;color:var(--done-ink);margin-top:14px;line-height:1.6;}

  .day-card{position:relative;background:var(--paper-raised);border:1px solid var(--line-soft);border-radius:12px;padding:12px 14px;margin-top:20px;box-shadow:0 4px 12px var(--shadow);}
  .day-card::before{
    content:"";position:absolute;top:-8px;left:18px;width:38px;height:16px;
    background:var(--blue-soft);opacity:0.85;border-radius:2px;transform:rotate(3deg);
  }
  .day-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .day-head h3{font-family:"Klee One",sans-serif;font-weight:600;font-size:1.05rem;margin:0;color:var(--blue);}
  .lang-vi .day-head h3{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;font-weight:800;}
  .day-count{font-size:0.7rem;color:var(--done-ink);margin-left:auto;}
  .day-del{background:none;border:none;color:var(--done-ink);font-size:0.9rem;cursor:pointer;padding:11px;margin:-11px -11px -11px -4px;min-width:40px;min-height:40px;}
  .day-empty{font-size:0.78rem;color:var(--done-ink);padding:6px 0;}
  .day-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px dashed var(--line-soft);}
  .day-item:first-of-type{border-top:none;}
  .day-item-name{flex:1;font-size:0.86rem;text-wrap:balance;}
  .day-item-btns{display:flex;gap:8px;}
  .miniBtn{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;width:40px;height:40px;font-size:0.9rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .miniBtn:disabled{opacity:0.35;cursor:default;}
  .add-day-btn{width:100%;margin-top:16px;padding:10px;border:1px dashed var(--line);border-radius:10px;background:transparent;color:var(--orange);font-size:0.86rem;cursor:pointer;font-weight:700;}

  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(8px);
    background:var(--ink);color:var(--paper);font-size:0.82rem;padding:9px 16px;border-radius:100px;
    opacity:0;pointer-events:none;transition:opacity .18s, transform .18s;z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  footer{max-width:640px;margin:40px auto 0;padding:0 16px;font-size:0.7rem;color:var(--done-ink);text-align:center;}

  @media (prefers-reduced-motion: reduce){
    .card,.chip,.toast{transition:none;}
  }
</style>

<header class="top">
  <div class="inner">
    <div class="title-row">
      <h1 id="pageTitle">西貢踩點手冊</h1>
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="langbtn" id="langBtn">VI</button>
        <div class="progress mono" id="progress">0 / 0</div>
      </div>
    </div>
    <p class="subtitle" id="pageSubtitle">胡志明市吃喝購物地點｜真地圖版・需要網路載入街道圖磚</p>
    <div class="sharebar">
      <button class="sharebtn" id="copyTextBtn"><svg class="icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="5" y="4" width="10" height="13" rx="1.5"/><rect x="7.5" y="2" width="5" height="3" rx="1"/></svg> <span id="copyTextLabel">複製地點清單文字</span></button>
      <button class="sharebtn" id="exportBtn"><svg class="icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3v9"/><path d="M6 8l4 4 4-4"/><path d="M4 16h12"/></svg> <span id="exportLabel">匯出我的行程</span></button>
    </div>
    <div class="tabs">
      <button class="tab active" data-view="list" id="tabList">清單</button>
      <button class="tab" data-view="map" id="tabMap">地圖</button>
      <button class="tab" data-view="itinerary" id="tabItinerary">行程</button>
    </div>
    <div class="search-row">
      <input class="search" id="search" type="text" placeholder="搜尋地點、類型或筆記…" />
    </div>
    <div class="chiprow" id="chiprow"></div>
  </div>
</header>

<div class="wrap">

  <div class="view active" id="view-list">
    <div id="sections"></div>
    <p class="empty-msg" id="emptyMsg">沒有符合的地點，換個關鍵字試試。</p>
  </div>

  <div class="view" id="view-map">
    <div id="leafletMap"></div>
    <p class="map-offline-note" id="mapOfflineNote">地圖需要網路連線讀取街道圖磚（OpenStreetMap），離線時會是空白</p>
    <div class="map-legend" id="mapLegend"></div>
    <p class="map-note" id="mapNote"></p>
  </div>

  <div class="view" id="view-itinerary">
    <div id="days"></div>
    <button class="add-day-btn" id="addDayBtn">＋ 新增一天</button>
  </div>

</div>

<footer><span id="totalCount" class="mono">0</span><span id="footerText"> 個地點・資料存在這台裝置的瀏覽器裡・把這個檔案傳給旅伴，各自打開記錄</span></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

  function isDark(){
    var root = document.documentElement;
    if(root.getAttribute("data-theme")==="dark") return true;
    if(root.getAttribute("data-theme")==="light") return false;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  }

    return L.divIcon({

  var STORAGE_KEY = "saigon-guide-realmap-v1";

  try{

  function slug(area, name){ return (area + "__" + name).replace(/\s+/g,"_"); }

  DATA.forEach(function(group, gi){
    group.items.forEach(function(item){

  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._h);
    toast._h = setTimeout(function(){ t.classList.remove("show"); }, 2200);
  }

  function scheduledDayLabel(placeId){
    for(var i=0;i<state.days.length;i++){
      var d = state.days[i];
      if((state.itinerary[d.id]||[]).indexOf(placeId) > -1) return dayLabelText(d);
    }
    return null;
  }

  /* ---------------- LIST VIEW ---------------- */
  var sectionsEl = document.getElementById("sections");
  var chiprowEl = document.getElementById("chiprow");

  function renderStars(placeId, container){
    container.innerHTML = "";
    var r = state.rating[placeId] || 0;
    for(var i=1;i<=5;i++){
      (function(i){
        var b = document.createElement("button");
        b.className = "star" + (i<=r ? " on" : "");
        b.textContent = i<=r ? "★" : "☆";
        b.setAttribute("aria-label", "評 " + i + " 星");
        b.addEventListener("click", function(){
          state.rating[placeId] = (state.rating[placeId] === i) ? 0 : i;
          save();
          renderStars(placeId, container);
        });
        container.appendChild(b);
      })(i);
    }
  }

  function dayLabelText(day){ return t("dayLabel") + (day.num != null ? day.num : (state.days.indexOf(day)+1)); }

  function buildDaySelect(placeId){
    var sel = document.createElement("select");
    sel.className = "daypick";
    var optNone = document.createElement("option");
    optNone.value = "";
    optNone.textContent = t("addToItinerary");
    sel.appendChild(optNone);
    state.days.forEach(function(d){
      var opt = document.createElement("option");
      opt.value = d.id;
      opt.textContent = dayLabelText(d);
      var already = (state.itinerary[d.id]||[]).indexOf(placeId) > -1;
      if(already){ opt.textContent += t("scheduled"); }
      sel.appendChild(opt);
    });
    var optNew = document.createElement("option");
    optNew.value = "__new__";
    optNew.textContent = t("newDayAdd");
    sel.appendChild(optNew);

    sel.addEventListener("change", function(){
      var v = sel.value;
      if(!v){ return; }
      var dayId = v;
      if(v === "__new__"){
        dayId = "day-" + (state.nextDay++);
        state.days.push({id:dayId, num: state.days.length + 1});
      }
      if(!state.itinerary[dayId]) state.itinerary[dayId] = [];
      if(state.itinerary[dayId].indexOf(placeId) === -1){
        state.itinerary[dayId].push(placeId);
        var d = state.days.filter(function(d){return d.id===dayId;})[0];
        toast(t("added") + (d ? dayLabelText(d) : ""));
      }
      save();
      sel.value = "";
      renderList();
      renderItinerary();
    });
    return sel;
  }

      var head = document.createElement("div");
      head.className = "area-head";
      var h2 = document.createElement("h2");
      h2.textContent = areaName(group);
      h2.style.borderColor = areaColor(gi);
      var count = document.createElement("span");
      count.className = "area-count mono";
      count.textContent = group.items.length + t("places");
      head.appendChild(h2);
      head.appendChild(count);
      sec.appendChild(head);

      var descText = areaDesc(group);
      if(descText){
        var desc = document.createElement("p");
        desc.className = "area-desc";
        desc.textContent = descText;
        sec.appendChild(desc);
      }

      group.items.forEach(function(item){
        var id = item.id;
        var card = document.createElement("div");
        card.className = "card" + (state.visited[id] ? " done" : "");
        card.id = "card-" + id;
        card.dataset.search = (item.name + " " + item.type + " " + item.note + " " + (VI_TYPE[item.type]||"") + " " + (VI_NOTE[item.name]||"")).toLowerCase();

        var top = document.createElement("div");
        top.className = "card-top";

        var check = document.createElement("button");
        check.className = "check";
        check.setAttribute("aria-label", t("markVisited") + item.name);
        check.setAttribute("aria-pressed", state.visited[id] ? "true" : "false");
        var checkRing = document.createElement("span");
        checkRing.className = "check-ring";
        checkRing.textContent = state.visited[id] ? "✓" : "";
        check.appendChild(checkRing);
        check.addEventListener("click", function(){
          state.visited[id] = !state.visited[id];
          save();
          card.classList.toggle("done", !!state.visited[id]);
          check.setAttribute("aria-pressed", state.visited[id] ? "true" : "false");
          checkRing.textContent = state.visited[id] ? "✓" : "";
          updateProgress();
          if(item.marker) item.marker.setIcon(pinIcon(areaColor(item.groupIndex), !!state.visited[id]));
        });

        var body = document.createElement("div");
        body.className = "card-body";

        var nameRow = document.createElement("div");
        nameRow.className = "card-name-row";
        var nameEl = document.createElement("span");
        nameEl.className = "card-name";
        nameEl.textContent = item.name;
        var tagEl = document.createElement("span");
        tagEl.className = "tag";
        tagEl.textContent = typeText(item);
        tagEl.style.borderColor = areaColor(gi);
        nameRow.appendChild(nameEl);
        nameRow.appendChild(tagEl);
        var dayLabel = scheduledDayLabel(id);
        if(dayLabel){
          var pill = document.createElement("span");
          pill.className = "day-pill";
          pill.textContent = dayLabel;
          nameRow.appendChild(pill);
        }
        body.appendChild(nameRow);

        var noteTxt = noteText(item);
        if(noteTxt){
          var noteEl = document.createElement("p");
          noteEl.className = "card-note";
          noteEl.textContent = noteTxt;
          body.appendChild(noteEl);
        }

        var actions = document.createElement("div");
        actions.className = "card-actions";
        var mapA = document.createElement("a");
        mapA.className = "maplink";
        mapA.href = item.link;
        mapA.target = "_blank";
        mapA.rel = "noopener noreferrer";
        mapA.textContent = item.link.indexOf("maps.app.goo.gl") > -1 ? t("openMap") : t("officialSite");
        actions.appendChild(mapA);

        if(item.lat != null && !item.otherCity){
          var locateBtn = document.createElement("button");
          locateBtn.className = "ghostbtn";
          locateBtn.textContent = t("locateOnMap");
          locateBtn.addEventListener("click", function(){
            document.querySelector('.tab[data-view="map"]').click();
            setTimeout(function(){
              if(item.marker){
                leafletMap.setView([item.lat, item.lng], 17, {animate:true});
                item.marker.openPopup();
              }
            }, 60);
          });
          actions.appendChild(locateBtn);
        }

        var detailBtn = document.createElement("button");
        detailBtn.className = "ghostbtn";
        var hasContent = state.rating[id] || (state.notes[id] && state.notes[id].trim());
        detailBtn.textContent = (hasContent ? "★ " : "") + t("notesRating");
        actions.appendChild(detailBtn);

        actions.appendChild(buildDaySelect(id));

        body.appendChild(actions);

        var detail = document.createElement("div");
        detail.className = "detail";
        var starsWrap = document.createElement("div");
        starsWrap.className = "stars";
        renderStars(id, starsWrap);
        detail.appendChild(starsWrap);
        var textarea = document.createElement("textarea");
        textarea.className = "notearea";
        textarea.placeholder = t("notePlaceholder");
        textarea.value = state.notes[id] || "";
        textarea.addEventListener("input", function(){
          state.notes[id] = textarea.value;
          save();
        });
        detail.appendChild(textarea);
        body.appendChild(detail);

        detailBtn.addEventListener("click", function(){
          detail.classList.toggle("open");
        });

        top.appendChild(check);
        top.appendChild(body);
        card.appendChild(top);
        sec.appendChild(card);
      });

      sectionsEl.appendChild(sec);

      var chip = document.createElement("button");
      chip.className = "chip";
      chip.textContent = areaName(group);
      chip.addEventListener("click", function(){
        document.getElementById("area-" + gi).scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"});
      });
      chiprowEl.appendChild(chip);
    });

    updateProgress();
    applySearch();
  }

  /* ---------------- SEARCH ---------------- */
  var searchEl = document.getElementById("search");
  var emptyMsg = document.getElementById("emptyMsg");
  function applySearch(){
    var q = searchEl.value.trim().toLowerCase();
    var anyVisible = false;
    document.querySelectorAll("section.area").forEach(function(sec){
      var visibleInSection = 0;
      sec.querySelectorAll(".card").forEach(function(card){
        var match = !q || card.dataset.search.indexOf(q) > -1;
        card.classList.toggle("hide", !match);
        if(match) visibleInSection++;
      });
      sec.style.display = visibleInSection ? "" : "none";
      if(visibleInSection) anyVisible = true;
    });
    emptyMsg.classList.toggle("show", !anyVisible);
    dimMarkers(q);
  }
  searchEl.addEventListener("input", applySearch);

  /* ---------------- TABS ---------------- */
  var tabs = document.querySelectorAll(".tab");
  var views = { list: document.getElementById("view-list"), map: document.getElementById("view-map"), itinerary: document.getElementById("view-itinerary") };
  function activateTab(name, pushHash){
    if(!views[name]) name = "list";
    tabs.forEach(function(t){ t.classList.toggle("active", t.dataset.view === name); });
    Object.keys(views).forEach(function(k){ views[k].classList.toggle("active", k === name); });
    document.getElementById("chiprow").style.display = name === "list" ? "" : "none";
    if(name === "map") initOrRefreshMap();
    if(pushHash !== false){
      history.replaceState(null, "", "#" + name);
    }
  }
  tabs.forEach(function(tab){
    tab.addEventListener("click", function(){ activateTab(tab.dataset.view); });
  });

  /* ---------------- REAL MAP (Leaflet + OpenStreetMap) ---------------- */
  var mapPlaces = PLACES.filter(function(p){ return p.lat != null && p.lng != null && !p.otherCity; });
  var leafletMap = null;
  var tileLayer = null;
  var CARTO_ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a>';
  function tileUrl(){
    return "https://{s}.basemaps.cartocdn.com/" + (isDark() ? "dark_all" : "rastertiles/voyager") + "/{z}/{x}/{y}{r}.png";
  }
  function swapTileLayer(){
    if(!leafletMap) return;
    if(tileLayer) leafletMap.removeLayer(tileLayer);
    tileLayer = L.tileLayer(tileUrl(), {maxZoom: 19, attribution: CARTO_ATTR}).addTo(leafletMap);
  }

  function popupHtml(p){
    var html = '<span class="popup-name">' + p.name + '</span>' +
      '<span class="tag">' + typeText(p) + '</span>';
    var n = noteText(p);
    if(n) html += '<div class="popup-note">' + n + '</div>';
    html += '<a class="popup-link" href="' + p.link + '" target="_blank" rel="noopener noreferrer">' +
      (p.link.indexOf("maps.app.goo.gl") > -1 ? t("openMap") : t("officialSite")) + '</a>';
    return html;
  }

  function renderMapChrome(){
    var legend = document.getElementById("mapLegend");
    legend.innerHTML = "";
    DATA.forEach(function(group, gi){
      var hasCoord = group.items.some(function(it){ return it.lat != null && !it.otherCity; });
      if(!hasCoord) return;
      var li = document.createElement("div");
      li.className = "legend-item";
      var dot = document.createElement("span");
      dot.className = "legend-dot";
      dot.style.background = areaColor(gi);
      li.appendChild(dot);
      li.appendChild(document.createTextNode(areaName(group)));
      legend.appendChild(li);
    });

    var missing = PLACES.filter(function(p){ return p.lat == null; }).map(function(p){return p.name;});
    var other = PLACES.filter(function(p){ return p.otherCity; }).map(function(p){return p.name + t("hanoi");});
    var noteParts = [];
    if(missing.length) noteParts.push(t("missingCoords") + missing.join("、"));
    if(other.length) noteParts.push(t("otherCityNote") + other.join("、"));
    document.getElementById("mapNote").textContent = noteParts.join("　");
  }

  function initOrRefreshMap(){
    if(!window.L){
      document.getElementById("mapNote").textContent = t("mapLoadFail");
      return;
    }
    if(!leafletMap){
      leafletMap = L.map("leafletMap", {scrollWheelZoom:true});
      swapTileLayer();

      var bounds = L.latLngBounds(mapPlaces.map(function(p){ return [p.lat, p.lng]; }));
      leafletMap.fitBounds(bounds, {padding:[24,24]});

      mapPlaces.forEach(function(p){
        var marker = L.marker([p.lat, p.lng], {
          icon: pinIcon(areaColor(p.groupIndex), !!state.visited[p.id])
        }).addTo(leafletMap);
        marker.bindPopup(popupHtml(p), {minWidth:180, maxWidth:240});
        marker.on("click", function(){
          leafletMap.setView([p.lat, p.lng], Math.max(leafletMap.getZoom(), 17), {animate:true});
        });
        p.marker = marker;
      });

      renderMapChrome();
    }
    setTimeout(function(){ leafletMap.invalidateSize(); }, 50);
  }

  function dimMarkers(q){
    mapPlaces.forEach(function(p){
      if(!p.marker) return;
      var match = !q || (p.name + " " + p.type + " " + p.note + " " + (VI_TYPE[p.type]||"") + " " + (VI_NOTE[p.name]||"")).toLowerCase().indexOf(q) > -1;
      p.marker.setOpacity(match ? 1 : 0.2);
    });
  }

  /* ---------------- ITINERARY VIEW ---------------- */
  var daysEl = document.getElementById("days");
  function renderItinerary(){
    daysEl.innerHTML = "";
    if(!state.days.length){
      var p = document.createElement("p");
      p.className = "day-empty";
      p.textContent = t("noDaysYet");
      daysEl.appendChild(p);
    }
    state.days.forEach(function(day){
      var card = document.createElement("div");
      card.className = "day-card";
      var head = document.createElement("div");
      head.className = "day-head";
      var h3 = document.createElement("h3");
      h3.textContent = dayLabelText(day);
      var cnt = document.createElement("span");
      cnt.className = "day-count mono";
      var ids = state.itinerary[day.id] || [];
      cnt.textContent = ids.length + t("stops");
      var del = document.createElement("button");
      del.className = "day-del";
      del.textContent = "✕";
      del.setAttribute("aria-label", t("deleteDay") + dayLabelText(day));
      del.addEventListener("click", function(){
        state.days = state.days.filter(function(d){return d.id !== day.id;});
        delete state.itinerary[day.id];
        save();
        renderItinerary();
        renderList();
      });
      head.appendChild(h3);
      head.appendChild(cnt);
      head.appendChild(del);
      card.appendChild(head);

      if(!ids.length){
        var empty = document.createElement("p");
        empty.className = "day-empty";
        empty.textContent = t("noPlacesThisDay");
        card.appendChild(empty);
      }

      ids.forEach(function(placeId, idx){
        var place = placeById[placeId];
        if(!place) return;
        var row = document.createElement("div");
        row.className = "day-item";
        var nm = document.createElement("span");
        nm.className = "day-item-name";
        nm.textContent = place.name;
        var btns = document.createElement("div");
        btns.className = "day-item-btns";

        var up = document.createElement("button");
        up.className = "miniBtn";
        up.textContent = "↑";
        up.setAttribute("aria-label", t("moveUpPrefix") + place.name + t("moveUpSuffix"));
        up.disabled = idx === 0;
        up.addEventListener("click", function(){
          var arr = state.itinerary[day.id];
          var tmp = arr[idx-1]; arr[idx-1] = arr[idx]; arr[idx] = tmp;
          save(); renderItinerary();
        });

        var down = document.createElement("button");
        down.className = "miniBtn";
        down.textContent = "↓";
        down.setAttribute("aria-label", t("moveUpPrefix") + place.name + t("moveDownSuffix"));
        down.disabled = idx === ids.length - 1;
        down.addEventListener("click", function(){
          var arr = state.itinerary[day.id];
          var tmp = arr[idx+1]; arr[idx+1] = arr[idx]; arr[idx] = tmp;
          save(); renderItinerary();
        });

        var rm = document.createElement("button");
        rm.className = "miniBtn";
        rm.textContent = "✕";
        rm.setAttribute("aria-label", t("removeFromItinerary"));
        rm.addEventListener("click", function(){
          state.itinerary[day.id] = state.itinerary[day.id].filter(function(id){return id !== placeId;});
          save(); renderItinerary(); renderList();
        });

        btns.appendChild(up); btns.appendChild(down); btns.appendChild(rm);
        row.appendChild(nm);
        row.appendChild(btns);
        card.appendChild(row);
      });

      daysEl.appendChild(card);
    });
  }

  document.getElementById("addDayBtn").addEventListener("click", function(){
    var dayId = "day-" + (state.nextDay++);
    state.days.push({id:dayId, num: state.days.length + 1});
    state.itinerary[dayId] = [];
    save();
    renderItinerary();
  });

  /* ---------------- SHARE (local-file friendly) ---------------- */
  function buildSummaryText(){
    var lines = [t("summaryTitle"), ""];
    if(!state.days.length){
      lines.push(t("summaryNoDays"));
    }
    state.days.forEach(function(day){
      lines.push("【" + dayLabelText(day) + "】");
      var ids = state.itinerary[day.id] || [];
      if(!ids.length) lines.push(t("summaryNoPlaces"));
      ids.forEach(function(id){
        var place = placeById[id];
        if(!place) return;
        var star = state.rating[id] ? " " + "★".repeat(state.rating[id]) : "";
        lines.push("　- " + place.name + "（" + typeText(place) + "）" + star);
        if(state.notes[id] && state.notes[id].trim()) lines.push(t("summaryNoteLabel") + state.notes[id].trim());
        lines.push(t("summaryMapLabel") + place.link);
      });
      lines.push("");
    });
    var visitedList = PLACES.filter(function(p){ return state.visited[p.id]; });
    if(visitedList.length){
      lines.push(t("summaryVisitedHeader"));
      visitedList.forEach(function(p){ lines.push("　- " + p.name); });
    }
    return lines.join("\n");
  }

  document.getElementById("copyTextBtn").addEventListener("click", function(){
    var text = buildSummaryText();
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){
        toast(t("copiedText"));
      }).catch(function(){
        toast(t("copyFailed"));
      });
    }else{
      toast(t("noClipboard"));
    }
  });

  document.getElementById("exportBtn").addEventListener("click", function(){
    var text = buildSummaryText();
    var blob = new Blob([text], {type:"text/plain;charset=utf-8"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "saigon-trip.txt";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    toast(t("exported"));
  });

  /* ---------------- theme change repaint ---------------- */
  if(window.matchMedia){
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function(){
      renderList();
      swapTileLayer();
      mapPlaces.forEach(function(p){
        if(p.marker) p.marker.setIcon(pinIcon(areaColor(p.groupIndex), !!state.visited[p.id]));
      });
    });
  }
  new MutationObserver(function(){
    renderList();
    swapTileLayer();
    mapPlaces.forEach(function(p){
      if(p.marker) p.marker.setIcon(pinIcon(areaColor(p.groupIndex), !!state.visited[p.id]));
    });
  }).observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]});

  /* ---------------- LANG TOGGLE ---------------- */
  function applyStaticLang(){
    document.getElementById("pageTitle").textContent = t("title");
    document.getElementById("pageSubtitle").textContent = t("subtitle");
    document.getElementById("copyTextLabel").textContent = t("copyText");
    document.getElementById("exportLabel").textContent = t("exportBtn");
    document.getElementById("tabList").textContent = t("tabList");
    document.getElementById("tabMap").textContent = t("tabMap");
    document.getElementById("tabItinerary").textContent = t("tabItinerary");
    document.getElementById("search").placeholder = t("searchPlaceholder");
    document.getElementById("emptyMsg").textContent = t("emptyMsg");
    document.getElementById("mapOfflineNote").textContent = t("mapOfflineNote");
    document.getElementById("addDayBtn").textContent = t("addDay");
    document.getElementById("footerText").textContent = t("footerText");
    document.getElementById("langBtn").textContent = lang === "zh" ? "VI" : "中文";
    document.documentElement.lang = lang === "zh" ? "zh-Hant" : "vi";
    document.body.classList.toggle("lang-vi", lang === "vi");
  }

  document.getElementById("langBtn").addEventListener("click", function(){
    lang = lang === "zh" ? "vi" : "zh";
    localStorage.setItem(LANG_KEY, lang);
    applyStaticLang();
    renderList();
    renderItinerary();
    if(leafletMap){
      mapPlaces.forEach(function(p){ if(p.marker) p.marker.setPopupContent(popupHtml(p)); });
      renderMapChrome();
    }
    applySearch();
  });

  applyStaticLang();
  renderList();
  renderItinerary();

  var initialTab = (location.hash || "").replace("#", "");
  if(views[initialTab] && initialTab !== "list") activateTab(initialTab, false);
})();
</script>
